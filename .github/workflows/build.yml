name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ls -la
          mkdir -p proj
          unzip -q ./*.zip -d proj
          D=$(find proj -maxdepth 2 -name package.json -printf '%h\n' | head -1)
          echo "PROJ=$D" >> $GITHUB_ENV
          echo "Project dir: $D"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: ${{ env.PROJ }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.PROJ }}
        run: npx vite build
        env:
          FOLIA_DISABLE_PWA: "1"

      - name: Capacitor sync
        working-directory: ${{ env.PROJ }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: folia-android-debug-apk
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
